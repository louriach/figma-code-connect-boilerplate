<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Connect Export</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ── */
    :root {
      --bg:           #1a1a1a;
      --surface:      #222222;
      --surface-alt:  #2a2a2a;
      --border:       #333333;
      --border-hover: #444444;

      --accent:       #a8d5b5;   /* soft pastel green */
      --accent-dim:   rgba(168, 213, 181, 0.12);
      --accent-hover: rgba(168, 213, 181, 0.2);

      --text-primary:   #f0f0f0;
      --text-secondary: #999999;
      --text-tertiary:  #666666;
      --text-accent:    #a8d5b5;

      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --size-base: 13px;
      --size-sm:   11px;
      --size-xs:   10px;
      --size-lg:   15px;

      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
    }

    /* ── Base ── */
    html, body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: var(--size-base);
      line-height: 1.5;
      height: 100%;
      overflow: hidden;
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-title {
      font-size: var(--size-base);
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .header-subtitle {
      font-size: var(--size-sm);
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .search {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: var(--size-base);
      padding: 5px 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search::placeholder { color: var(--text-tertiary); }
    .search:focus { border-color: var(--accent); }

    .btn-text {
      background: none;
      border: none;
      color: var(--text-accent);
      font-family: var(--font);
      font-size: var(--size-sm);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: var(--radius-sm);
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn-text:hover { background: var(--accent-hover); }
    .btn-text.muted { color: var(--text-secondary); }
    .btn-text.muted:hover { color: var(--text-primary); background: var(--surface-alt); }

    .toolbar-divider {
      width: 1px;
      height: 14px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* ── Component list ── */
    .list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-track { background: transparent; }
    .list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Group ── */
    .group { margin-bottom: 2px; }

    .group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }

    .group-header:hover { background: var(--surface-alt); }

    .group-chevron {
      width: 12px;
      height: 12px;
      color: var(--text-tertiary);
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .group-chevron.open { transform: rotate(90deg); }

    .group-checkbox {
      flex-shrink: 0;
    }

    .group-name {
      font-size: var(--size-sm);
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex: 1;
    }

    .group-count {
      font-size: var(--size-xs);
      color: var(--text-tertiary);
    }

    .group-count .selected-count {
      color: var(--text-accent);
    }

    .group-items {
      overflow: hidden;
    }

    .group-items.collapsed { display: none; }

    /* ── Component row ── */
    .component-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 16px 5px 36px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .component-row:hover { background: var(--surface-alt); }
    .component-row.checked { background: var(--accent-dim); }
    .component-row.checked:hover { background: var(--accent-hover); }

    .component-row:hover .btn-locate { opacity: 1; }

    .component-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .component-name {
      font-size: var(--size-base);
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .component-page {
      font-size: var(--size-xs);
      color: var(--text-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .component-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .component-prop-count {
      font-size: var(--size-xs);
      color: var(--text-tertiary);
    }

    .btn-locate {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border: none;
      background: none;
      color: var(--text-tertiary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
      flex-shrink: 0;
      padding: 0;
    }

    .btn-locate:hover {
      color: var(--text-accent);
      background: var(--accent-dim);
    }

    .btn-locate svg {
      width: 13px;
      height: 13px;
    }

    /* ── Custom checkbox ── */
    .checkbox-wrap {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .checkbox-wrap input[type="checkbox"] {
      appearance: none;
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--border-hover);
      border-radius: 3px;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .checkbox-wrap input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkbox-wrap input[type="checkbox"]:indeterminate {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    .checkbox-wrap input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 1px;
      width: 6px;
      height: 9px;
      border: 1.5px solid var(--bg);
      border-top: none;
      border-left: none;
      transform: rotate(45deg) scaleY(0.85);
    }

    .checkbox-wrap input[type="checkbox"]:indeterminate::after {
      content: '';
      position: absolute;
      left: 2.5px;
      top: 5px;
      width: 7px;
      height: 1.5px;
      background: var(--accent);
    }

    /* ── Empty state ── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
      color: var(--text-tertiary);
      font-size: var(--size-sm);
      padding: 24px;
      text-align: center;
    }

    .empty-icon {
      font-size: 24px;
      opacity: 0.4;
    }

    /* ── Loading state ── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: var(--text-secondary);
      font-size: var(--size-sm);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .footer-summary {
      flex: 1;
      font-size: var(--size-sm);
      color: var(--text-secondary);
    }

    .footer-summary strong {
      color: var(--text-accent);
      font-weight: 600;
    }

    .btn-export {
      background: var(--accent);
      color: #1a1a1a;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font);
      font-size: var(--size-base);
      font-weight: 600;
      padding: 7px 16px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-export:hover { opacity: 0.88; }
    .btn-export:active { transform: scale(0.98); }
    .btn-export:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 7px 14px;
      font-size: var(--size-sm);
      color: var(--text-primary);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      z-index: 100;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.success { border-color: var(--accent); color: var(--text-accent); }
  </style>
</head>
<body>

<div class="layout">

  <!-- Header -->
  <div class="header">
    <div class="header-title">Code Connect Export</div>
    <div class="header-subtitle">Select components to connect to your codebase</div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input class="search" type="text" placeholder="Filter components…" id="search" />
    <button class="btn-text" id="btn-select-all">Select all</button>
    <div class="toolbar-divider"></div>
    <button class="btn-text muted" id="btn-deselect-all">Clear</button>
  </div>

  <!-- Component list -->
  <div class="list" id="list">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>Scanning components…</span>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-summary" id="summary">Loading…</div>
    <button class="btn-export" id="btn-export" disabled>Export</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let allComponents = [];   // raw from plugin
  let groups = {};          // { groupName: [component, …] }
  let selected = new Set(); // nodeIds
  let collapsed = new Set();

  // ── Message from plugin sandbox ───────────────────────────────────────────
  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'components') {
      allComponents = msg.components;
      buildGroups(allComponents);
      render(allComponents);
      // Select all by default
      allComponents.forEach(c => selected.add(c.nodeId));
      refreshCheckboxes();
      updateSummary();
    }
  };

  // ── Group building ────────────────────────────────────────────────────────
  function buildGroups(components) {
    groups = {};
    components.forEach(c => {
      const g = c.group || 'Ungrouped';
      if (!groups[g]) groups[g] = [];
      groups[g].push(c);
    });
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function render(components) {
    const list = document.getElementById('list');
    document.getElementById('loading').remove();

    if (components.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">◻</div>
          <div>No main components found in this file</div>
        </div>`;
      return;
    }

    buildGroups(components);
    list.innerHTML = '';

    Object.entries(groups).forEach(([groupName, items]) => {
      const groupEl = document.createElement('div');
      groupEl.className = 'group';
      groupEl.dataset.group = groupName;

      const isCollapsed = collapsed.has(groupName);
      const selectedInGroup = items.filter(c => selected.has(c.nodeId)).length;

      groupEl.innerHTML = `
        <div class="group-header" data-group-toggle="${groupName}">
          <svg class="group-chevron ${isCollapsed ? '' : 'open'}" viewBox="0 0 12 12" fill="none">
            <path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="checkbox-wrap">
            <input type="checkbox" data-group-check="${groupName}" />
          </div>
          <div class="group-name">${groupName}</div>
          <div class="group-count">
            <span class="selected-count" data-group-selected="${groupName}">${selectedInGroup}</span>
            <span> / ${items.length}</span>
          </div>
        </div>
        <div class="group-items ${isCollapsed ? 'collapsed' : ''}" data-group-items="${groupName}">
          ${items.map(c => `
            <div class="component-row ${selected.has(c.nodeId) ? 'checked' : ''}" data-node="${c.nodeId}">
              <div class="checkbox-wrap">
                <input type="checkbox" data-node-check="${c.nodeId}" ${selected.has(c.nodeId) ? 'checked' : ''} />
              </div>
              <div class="component-meta">
                <div class="component-name">${leafName(c.figmaName)}</div>
                ${c.page ? `<div class="component-page">${c.page}</div>` : ''}
              </div>
              <div class="component-right">
                ${c.properties && c.properties.length > 0
                  ? `<div class="component-prop-count">${c.properties.length} prop${c.properties.length !== 1 ? 's' : ''}</div>`
                  : ''}
                <button class="btn-locate" data-locate="${c.nodeId}" title="Jump to component in Figma">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
                  </svg>
                </button>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      list.appendChild(groupEl);
    });

    refreshGroupCheckboxes();
    attachListeners();
  }

  function leafName(figmaName) {
    const parts = figmaName.split('/');
    return parts[parts.length - 1].trim();
  }

  // ── Event listeners ───────────────────────────────────────────────────────
  function attachListeners() {
    // Group toggle (collapse/expand)
    document.querySelectorAll('[data-group-toggle]').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.checkbox-wrap')) return;
        const g = el.dataset.groupToggle;
        const chevron = el.querySelector('.group-chevron');
        const items = document.querySelector(`[data-group-items="${g}"]`);
        if (collapsed.has(g)) {
          collapsed.delete(g);
          chevron.classList.add('open');
          items.classList.remove('collapsed');
        } else {
          collapsed.add(g);
          chevron.classList.remove('open');
          items.classList.add('collapsed');
        }
      });
    });

    // Group checkbox
    document.querySelectorAll('[data-group-check]').forEach(cb => {
      cb.addEventListener('change', (e) => {
        const g = cb.dataset.groupCheck;
        const items = groups[g] || [];
        if (e.target.checked) {
          items.forEach(c => selected.add(c.nodeId));
        } else {
          items.forEach(c => selected.delete(c.nodeId));
        }
        refreshCheckboxes();
        updateSummary();
      });
    });

    // Component row click
    document.querySelectorAll('[data-node]').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('.checkbox-wrap')) return;
        if (e.target.closest('.btn-locate')) return;
        const nodeId = row.dataset.node;
        toggleNode(nodeId);
      });
    });

    // Component checkbox
    document.querySelectorAll('[data-node-check]').forEach(cb => {
      cb.addEventListener('change', () => {
        toggleNode(cb.dataset.nodeCheck);
      });
    });

    // Locate button — tells main.ts to scroll and zoom to this node
    document.querySelectorAll('[data-locate]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        parent.postMessage({
          pluginMessage: { type: 'locate', nodeId: btn.dataset.locate }
        }, '*');
      });
    });
  }

  function toggleNode(nodeId) {
    if (selected.has(nodeId)) {
      selected.delete(nodeId);
    } else {
      selected.add(nodeId);
    }
    refreshCheckboxes();
    updateSummary();
  }

  // ── Toolbar buttons ───────────────────────────────────────────────────────
  document.getElementById('btn-select-all').addEventListener('click', () => {
    currentComponents().forEach(c => selected.add(c.nodeId));
    refreshCheckboxes();
    updateSummary();
  });

  document.getElementById('btn-deselect-all').addEventListener('click', () => {
    currentComponents().forEach(c => selected.delete(c.nodeId));
    refreshCheckboxes();
    updateSummary();
  });

  // ── Search ────────────────────────────────────────────────────────────────
  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    const filtered = q
      ? allComponents.filter(c =>
          c.figmaName.toLowerCase().includes(q) ||
          (c.page && c.page.toLowerCase().includes(q))
        )
      : allComponents;
    render(filtered);
    refreshCheckboxes();
  });

  function currentComponents() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    return q
      ? allComponents.filter(c =>
          c.figmaName.toLowerCase().includes(q) ||
          (c.page && c.page.toLowerCase().includes(q))
        )
      : allComponents;
  }

  // ── Refresh UI state ──────────────────────────────────────────────────────
  function refreshCheckboxes() {
    // Component rows
    document.querySelectorAll('[data-node]').forEach(row => {
      const nodeId = row.dataset.node;
      const cb = row.querySelector('[data-node-check]');
      const checked = selected.has(nodeId);
      if (cb) cb.checked = checked;
      row.classList.toggle('checked', checked);
    });

    refreshGroupCheckboxes();
  }

  function refreshGroupCheckboxes() {
    Object.entries(groups).forEach(([groupName, items]) => {
      const cb = document.querySelector(`[data-group-check="${groupName}"]`);
      const countEl = document.querySelector(`[data-group-selected="${groupName}"]`);
      if (!cb) return;

      const selectedCount = items.filter(c => selected.has(c.nodeId)).length;
      if (countEl) countEl.textContent = selectedCount;

      cb.checked = selectedCount === items.length;
      cb.indeterminate = selectedCount > 0 && selectedCount < items.length;
    });
  }

  function updateSummary() {
    const count = selected.size;
    const summary = document.getElementById('summary');
    const exportBtn = document.getElementById('btn-export');

    if (count === 0) {
      summary.innerHTML = `<span>No components selected</span>`;
    } else {
      summary.innerHTML = `<strong>${count}</strong> component${count !== 1 ? 's' : ''} selected`;
    }

    exportBtn.disabled = count === 0;
  }

  // ── Export ────────────────────────────────────────────────────────────────
  document.getElementById('btn-export').addEventListener('click', () => {
    const toExport = allComponents.filter(c => selected.has(c.nodeId));
    parent.postMessage({
      pluginMessage: { type: 'export', components: toExport }
    }, '*');
  });

  // ── Toast ─────────────────────────────────────────────────────────────────
  function showToast(message, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = `toast visible ${type}`;
    setTimeout(() => toast.classList.remove('visible'), 2500);
  }

  // Handle messages from main.ts
  window.addEventListener('message', (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    // Trigger file download
    if (msg.type === 'download') {
      const blob = new Blob([msg.json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = msg.filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    if (msg.type === 'export-done') {
      showToast(`Exported ${msg.count} component${msg.count !== 1 ? 's' : ''}`, 'success');
    }
  });
</script>
</body>
</html>
